name: Docker Build & Push

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: read

jobs:
  validate:
    uses: ./.github/workflows/ci.yml

  build:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # `latest` added explicitly so install.sh can pull a known-good image
          # instead of falling back to git-clone+local-build (the fallback path
          # was the trigger for the Ubuntu 25.10 restart-loop bug — see history).
          # Only attached to default-branch builds; tagged releases also get the
          # semver tags below.
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build candidate image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: production
          load: true
          push: false
          tags: docker-dash:ci-${{ github.sha }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify production startup and secret persistence
        env:
          CANDIDATE: docker-dash:ci-${{ github.sha }}
        run: |
          docker run --rm --network none --cap-drop=ALL \
            --security-opt=no-new-privileges --cpus=1 --memory=512m \
            -v /var/run/docker.sock:/var/run/docker.sock:ro \
            -v "$PWD/scripts:/audit:ro" \
            -e NODE_PATH=/app/node_modules -e DD_SMOKE_APP_IMAGE="$CANDIDATE" \
            --entrypoint node "$CANDIDATE" /audit/smoke-production-image.js

      - name: Verify rebuilt scanner provenance and functionality
        env:
          CANDIDATE: docker-dash:ci-${{ github.sha }}
        run: |
          IMAGE_ID=$(docker image inspect --format '{{.Id}}' "$CANDIDATE")
          docker run --rm --network none --cap-drop=ALL \
            --security-opt=no-new-privileges --cpus=1 --memory=512m \
            -v /var/run/docker.sock:/var/run/docker.sock:ro \
            -v "$PWD/scripts:/audit:ro" \
            -e NODE_PATH=/app/node_modules -e DD_SMOKE_APP_IMAGE="$IMAGE_ID" \
            --entrypoint node "$IMAGE_ID" /audit/smoke-scanner-image.js

      - name: Gate final image vulnerabilities
        env:
          CANDIDATE: docker-dash:ci-${{ github.sha }}
        # The npm lockfile does not cover npm's own bundle or embedded Go
        # dependencies in scanners. Generate both unfiltered reports, then apply only
        # exact, expiring, artifact-bound applicability decisions.
        run: |
          REPORT_DIR=$(mktemp -d)
          trap 'rm -rf "$REPORT_DIR"' EXIT
          docker run --rm --cpus=2 --memory=2g \
            --cap-drop=ALL --security-opt=no-new-privileges \
            -v /var/run/docker.sock:/var/run/docker.sock:ro \
            --entrypoint trivy "$CANDIDATE" image \
            --image-src docker --scanners vuln --timeout 10m --format json --quiet \
            "$CANDIDATE" > "$REPORT_DIR/trivy.json"
          # Grype's database can contain advisories absent from Trivy's distro
          # feed. Run both gates, even if the first one reports findings.
          docker run --rm --cpus=2 --memory=2g \
            --cap-drop=ALL --security-opt=no-new-privileges \
            -v /var/run/docker.sock:/var/run/docker.sock:ro \
            --entrypoint grype "$CANDIDATE" \
            "docker:$CANDIDATE" --output json --quiet > "$REPORT_DIR/grype.json"
          docker run --rm --network none --read-only --cpus=1 --memory=512m \
            --cap-drop=ALL --security-opt=no-new-privileges \
            -v "$PWD:/audit:ro" -v "$REPORT_DIR:/reports:ro" \
            -e DD_TRIVY_REPORT=/reports/trivy.json \
            -e DD_GRYPE_REPORT=/reports/grype.json \
            -e DD_IMAGE_VULNERABILITY_POLICY=/audit/docker/scanners/image-vulnerability-policy.json \
            -e DD_SCANNER_REVIEW=/audit/docker/scanners/reviewed-artifacts.json \
            -e DD_REPOSITORY_ROOT=/audit \
            --entrypoint node "$CANDIDATE" /audit/scripts/gate-image-vulnerabilities.js

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish the scanned image
        if: github.event_name != 'pull_request'
        env:
          CANDIDATE: docker-dash:ci-${{ github.sha }}
          RELEASE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            docker tag "$CANDIDATE" "$tag"
            docker push "$tag"
          done <<< "$RELEASE_TAGS"

      - name: Image summary
        if: github.event_name != 'pull_request'
        run: |
          echo "### Docker Image Published" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Tags:" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
